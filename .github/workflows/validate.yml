name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run validation suite
        run: python -m unittest discover -s tests -v

      - name: Verify generated county data is current
        run: |
          python app/build_dataset.py
          git diff --exit-code -- app/data/counties.json
